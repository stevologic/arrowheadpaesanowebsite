name: Chiefs Narrative (daily)

# Regenerates the Chiefs Narrative every morning as a three-act desk:
# last-game review, current state / work list, then next-game plan and
# matchup. Also refreshes the published schedule more often (evenings and
# late game windows), opens an automated pull request, auto-merges it, and
# deploys the refreshed site to GitHub Pages.
#
# Install and tests run in a contents:read job with persist-credentials:
# false. Only the final update/deploy jobs get contents:write; they
# commit generated data and never run unittest or pip install -r.
#
# Schedule freshness does not depend on narrative text changing: a score-only
# or kickoff/network update still commits data/schedule_2026.json and deploys.
# Evening / late-window runs are --schedule-only so they do not mint a new
# narrative edition.
#
# Providers (auto-detected in tools/chiefs_narrative/providers.py):
#   * If the XAI_API_KEY (or GROK_API_KEY) secret exists -> Grok writes it.
#   * Else if OPENAI_API_KEY exists -> OpenAI writes it.
#   * Otherwise the deterministic offline writer produces a complete, cited edition.
# Nothing is required for this to run; add XAI_API_KEY or OPENAI_API_KEY (and
# optionally ODDS_API_KEY) as repository secrets to upgrade the writing.
# Optional repository variable GROK_MODEL selects the xAI model (default grok-4.6).
# Force one with the workflow_dispatch "provider" input (e.g. grok).

on:
  schedule:
    # ~4:37 AM CDT / 3:37 AM CST — overnight news + full narrative + slate.
    # Earlier, off-peak minute so GitHub is less likely to start the run hours late.
    - cron: "37 9 * * *"
    # ~10:43 PM CDT / 9:43 PM CST — after afternoon/TNF/Saturday kickoffs.
    - cron: "43 3 * * *"
    # ~2:20 AM CDT Sun/Mon/Tue — after Saturday, SNF, and Monday Night windows.
    - cron: "20 7 * * 0,1,2"
  workflow_dispatch:
    inputs:
      provider:
        description: "Force writer (blank = auto). grok|openai|anthropic|offline"
        required: false
        default: ""
      mode:
        description: "full = narrative + slate; schedule = slate only"
        required: false
        default: "full"

permissions:
  contents: read

concurrency:
  group: chiefs-narrative
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HUGO_VERSION: 0.152.2
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r tools/requirements.txt

      - name: Decide desk mode
        id: mode
        run: |
          MODE="schedule"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.mode }}" != "schedule" ]; then
              MODE="full"
            fi
          elif [ "${{ github.event.schedule }}" = "37 9 * * *" ]; then
            MODE="full"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Desk mode: $MODE"

      - name: Refresh the published slate
        run: python -m tools.chiefs_narrative.generate --schedule-only

      - name: Skip publish while a Chiefs game is live
        id: live
        run: |
          python - <<'PY'
          import os
          from tools.chiefs_narrative import collect, phase
          games = collect.load_cached_schedule()
          skip = phase.any_live(games)
          print(f"live={skip}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"skip={'true' if skip else 'false'}\n")
          if skip:
              print("Chiefs game is live; skipping new edition and PR.")
          PY

      - name: Generate the Chiefs Narrative
        if: steps.mode.outputs.mode == 'full' && steps.live.outputs.skip != 'true'
        env:
          CHIEFS_PROVIDER: ${{ github.event.inputs.provider }}
          # Grok/xAI takes precedence over OpenAI when its key is present.
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          GROK_MODEL: ${{ vars.GROK_MODEL }}
          GROK_FALLBACK_MODELS: ${{ vars.GROK_FALLBACK_MODELS }}
          XAI_BASE_URL: ${{ vars.XAI_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python - <<'PY'
          from tools.chiefs_narrative.providers import grok_model
          print(f"GROK_MODEL env={__import__('os').environ.get('GROK_MODEL', '')!r}")
          print(f"resolved grok model={grok_model()}")
          import os, requests
          key = os.environ.get("XAI_API_KEY") or os.environ.get("GROK_API_KEY")
          if key:
              try:
                  r = requests.get("https://api.x.ai/v1/models",
                                   headers={"Authorization": f"Bearer {key}"}, timeout=20)
                  ids = sorted(m.get("id", "") for m in r.json().get("data", []))
                  print(f"xai models ({r.status_code}): {', '.join(ids)}")
              except Exception as exc:  # diagnostics only
                  print(f"xai models probe failed: {exc}")
          PY
          python -m tools.chiefs_narrative.generate

      - name: Detect changes
        id: diff
        run: |
          if [ "${{ steps.live.outputs.skip }}" = "true" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Chiefs game in progress; skipping publish."
            exit 0
          fi
          git add -- \
            data/narrative.json \
            data/narrative_archive.json \
            data/narrative_repair.json \
            data/narrative_editions \
            data/wire.json \
            data/schedule_2026.json \
            public/images/narrative
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No slate or narrative changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat
          fi

      - name: Upload generated data
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: narrative-data
          path: |
            data/narrative.json
            data/narrative_archive.json
            data/narrative_repair.json
            data/narrative_editions
            data/wire.json
            data/schedule_2026.json
            public/images/narrative

  test:
    needs: generate
    if: needs.generate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HUGO_VERSION: 0.152.2
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download generated data
        uses: actions/download-artifact@v4
        with:
          name: narrative-data
          path: .

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r tools/requirements.txt

      - name: Install Hugo
        run: |
          curl -fsSL --output "${{ runner.temp }}/hugo.tar.gz" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xf "${{ runner.temp }}/hugo.tar.gz"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

      - name: Gate generated content
        run: |
          set -euo pipefail
          python -m unittest discover -s tools/tests -v
          check_rc=0
          python -m tools.chiefs_narrative.generate --check-edition || check_rc=$?
          if [ "$check_rc" -ne 0 ]; then
            echo "check-edition still has unfixable issues; holding automerge"
            python - <<'PY'
          import json
          from pathlib import Path
          path = Path("data/narrative_repair.json")
          payload = {}
          if path.is_file():
              try:
                  loaded = json.loads(path.read_text(encoding="utf-8"))
              except json.JSONDecodeError:
                  loaded = {}
              if isinstance(loaded, dict):
                  payload = loaded
          payload["holdAutomerge"] = True
          path.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY
          fi
          python -m tools.chiefs_narrative.generate --diagrams-only
          git diff --exit-code -- public/images/narrative
          hugo --gc --minify
          pages_rc=0
          python -m tools.chiefs_narrative.review_gate --pages --dist dist || pages_rc=$?
          if [ "$pages_rc" -eq 2 ]; then
            echo "unsigned Review edition; pages gate holds deploy (exit 2)"
          elif [ "$pages_rc" -ne 0 ]; then
            exit "$pages_rc"
          fi

      - name: Record publish metadata
        env:
          DESK_MODE: ${{ needs.generate.outputs.mode }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.chiefs_narrative import drop_body, facts
          repair = {}
          repair_path = Path("data/narrative_repair.json")
          if repair_path.is_file():
              try:
                  loaded = json.loads(repair_path.read_text(encoding="utf-8"))
              except json.JSONDecodeError:
                  loaded = {}
              if isinstance(loaded, dict):
                  repair = loaded
          narrative = {}
          live = Path("data/narrative.json")
          if live.is_file():
              try:
                  loaded = json.loads(live.read_text(encoding="utf-8"))
              except json.JSONDecodeError:
                  loaded = {}
              if isinstance(loaded, dict):
                  narrative = loaded
          hold = bool(repair.get("holdAutomerge"))
          if facts.review_requires_human(narrative):
              hold = True
          meta = {
              "mode": __import__("os").environ.get("DESK_MODE") or "schedule",
              "holdMerge": hold,
              "dropBody": drop_body.drop_body(repair),
              "edition": str(narrative.get("edition") or ""),
              "headline": str(narrative.get("headline") or ""),
          }
          Path(".narrative-publish.json").write_text(
              json.dumps(meta, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload validated data
        uses: actions/upload-artifact@v4
        with:
          name: narrative-publish
          include-hidden-files: true
          path: |
            data/narrative.json
            data/narrative_archive.json
            data/narrative_repair.json
            data/narrative_editions
            data/wire.json
            data/schedule_2026.json
            public/images/narrative
            .narrative-publish.json

  update:
    needs: [generate, test]
    if: needs.generate.outputs.changed == 'true' && needs.test.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      publish: ${{ steps.publish.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download validated data
        uses: actions/download-artifact@v4
        with:
          name: narrative-publish
          path: .

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Refuse unsigned Review editions
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${GITHUB_REF_NAME}"
          GATE_BASE="${RUNNER_TEMP}/gate-base"
          git worktree add --detach "$GATE_BASE" "origin/${GITHUB_REF_NAME}"
          cd "$GATE_BASE"
          pages_rc=0
          PYTHONPATH="$GATE_BASE" python -P -m tools.chiefs_narrative.review_gate --pages \
            --root "${GITHUB_WORKSPACE}" || pages_rc=$?
          if [ "$pages_rc" -eq 2 ]; then
            echo "Unsigned Review edition; continuing to a held PR"
          elif [ "$pages_rc" -ne 0 ]; then
            exit "$pages_rc"
          fi

      - name: Open pull request and wait for CI gates
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DESK_MODE: ${{ needs.generate.outputs.mode }}
        run: |
          set -euo pipefail
          echo "publish=false" >> "$GITHUB_OUTPUT"
          BASE="${GITHUB_REF_NAME}"
          STAMP="$(date -u +%Y%m%d-%H%M)"
          BRANCH="narrative/update-${STAMP}"

          git config user.name "arrowhead-paesano-bot"
          git config user.email "actions@github.com"
          git add -- \
            data/narrative.json \
            data/narrative_archive.json \
            data/narrative_repair.json \
            data/narrative_editions \
            data/wire.json \
            data/schedule_2026.json \
            public/images/narrative
          git checkout -b "$BRANCH"

          HOLD_MERGE="false"
          DROP_BODY=""
          if [ -f .narrative-publish.json ]; then
            HOLD_MERGE="$(python -c "import json;print('true' if json.load(open('.narrative-publish.json')).get('holdMerge') else 'false')")"
            DROP_BODY="$(python -c "import json;print(json.load(open('.narrative-publish.json')).get('dropBody') or '')")"
          fi
          if [ "$HOLD_MERGE" != "true" ] && [ "$DESK_MODE" = "full" ] && [ -f data/narrative.json ]; then
            REVIEW_HOLD="$(python -c "import json;print('true' if json.load(open('.narrative-publish.json')).get('holdMerge') else 'false')")"
            if [ "$REVIEW_HOLD" = "true" ]; then
              HOLD_MERGE="true"
            fi
          fi

          if [ "$DESK_MODE" = "full" ] && [ -f data/narrative.json ]; then
            EDITION="$(python -c "import json;print(json.load(open('.narrative-publish.json')).get('edition') or json.load(open('data/narrative.json'))['edition'])")"
            HEADLINE="$(python -c "import json;print(json.load(open('.narrative-publish.json')).get('headline') or json.load(open('data/narrative.json'))['headline'])")"
            git commit -m "Chiefs Narrative: ${EDITION}" -m "${HEADLINE}"
            TITLE="Chiefs Narrative — ${EDITION}"
            BODY="$(printf '%s\n' \
              "Automated refresh of the Chiefs Narrative and 2026 slate." \
              "" \
              "**${HEADLINE}**" \
              "" \
              "- Regenerated data/narrative.json + archive: last-game review (ESPN recap + wire), current state / work list, and next-game plan + matchup, plus the live schedule, news wire, model projection, Vegas line and prediction markets." \
              "- Wrote data/schedule_2026.json from ESPN (kickoffs in CT, networks, venues, final scores when ESPN has them)." \
              "- Re-rendered the X's-and-O's diagrams." \
              "" \
              "${DROP_BODY}" \
              "" \
              "Generated by the Chiefs Narrative (daily) workflow.")"
          else
            git commit -m "Chiefs schedule: refresh 2026 slate"
            TITLE="Chiefs schedule — ${STAMP}"
            BODY="$(printf '%s\n' \
              "Automated schedule-only refresh. Narrative text was not regenerated." \
              "" \
              "- Updated data/schedule_2026.json from the live ESPN slate (or the last good file if ESPN was down)." \
              "- Kickoffs stay in America/Chicago. Scores are published only when ESPN reports them." \
              "" \
              "Generated by the Chiefs Narrative (daily) workflow.")"
          fi

          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"

          PR_URL="$(gh pr create --base "$BASE" --head "$BRANCH" \
            --title "$TITLE" --body "$BODY")"

          echo "Opened $PR_URL"

          if [ "$HOLD_MERGE" = "true" ]; then
            echo "Holding automerge: review requires human QA, leftover issues, or noisy salvage (listed in the PR body)."
            gh pr edit "$PR_URL" --add-label hold || true
            echo "publish=false" >> "$GITHUB_OUTPUT"
            gh workflow run ci.yml --ref "$BRANCH" || true
            exit 0
          fi

          # GITHUB_TOKEN-created PRs do not trigger pull_request workflows, so
          # a one-shot PR-check listing exits 1 with "no checks reported"
          # (run 36360998269). Dispatch CI against this edition branch —
          # workflow_dispatch is the documented GITHUB_TOKEN exception —
          # then poll that run.
          gh workflow run ci.yml --ref "$BRANCH"

          RUN_ID=""
          APPEAR_DEADLINE=$((SECONDS + 180))
          while [ "$SECONDS" -lt "$APPEAR_DEADLINE" ]; do
            RUN_ID="$(gh run list --workflow ci.yml --branch "$BRANCH" --limit 5 \
              --json databaseId,event,status \
              --jq '[.[] | select(.event=="workflow_dispatch")][0].databaseId // empty' \
              || true)"
            if [ -n "$RUN_ID" ]; then
              break
            fi
            sleep 5
          done
          if [ -z "$RUN_ID" ]; then
            echo "ERROR: workflow_dispatch of ci.yml on $BRANCH never appeared" >&2
            exit 1
          fi
          echo "Waiting for CI run $RUN_ID on $BRANCH"

          DONE_DEADLINE=$((SECONDS + 900))
          CONCLUSION=""
          while [ "$SECONDS" -lt "$DONE_DEADLINE" ]; do
            CONCLUSION="$(gh run view "$RUN_ID" --json status,conclusion \
              --jq '[.status, (.conclusion // "")] | join(" ")')"
            echo "  $CONCLUSION"
            case "$CONCLUSION" in
              "completed success") break ;;
              completed*)
                echo "ERROR: CI gates $CONCLUSION" >&2
                gh run view "$RUN_ID" --log-failed || true
                exit 1
                ;;
            esac
            sleep 10
          done
          if [ "$CONCLUSION" != "completed success" ]; then
            echo "ERROR: CI gates timed out ($CONCLUSION)" >&2
            exit 1
          fi

          gh pr merge "$PR_URL" --squash --delete-branch
          echo "publish=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: update
    if: needs.update.outputs.publish == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: pages-publish
      cancel-in-progress: false
    env:
      HUGO_VERSION: 0.152.2
    steps:
      - name: Checkout (post-merge default branch)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Hugo
        run: |
          curl -fsSL --output "${{ runner.temp }}/hugo.tar.gz" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xf "${{ runner.temp }}/hugo.tar.gz"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

      - name: Build
        run: |
          git pull --ff-only origin "${GITHUB_REF_NAME}" || true
          hugo --gc --minify
          touch dist/.nojekyll

      - name: Skip unsigned Review editions
        id: review
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${GITHUB_REF_NAME}"
          GATE_BASE="${RUNNER_TEMP}/gate-base"
          git worktree add --detach "$GATE_BASE" "origin/${GITHUB_REF_NAME}"
          cd "$GATE_BASE"
          if PYTHONPATH="$GATE_BASE" python -P -m tools.chiefs_narrative.review_gate --pages \
            --dist "${GITHUB_WORKSPACE}/dist" --root "${GITHUB_WORKSPACE}"; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            rc=$?
            if [ "$rc" -eq 2 ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Unsigned Review edition; skipping gh-pages deploy"
            else
              exit "$rc"
            fi
          fi

      - name: Publish to gh-pages
        if: steps.review.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist
          git init -q -b gh-pages
          git config user.name "arrowhead-paesano-bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -q -m "Deploy narrative ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages:gh-pages
