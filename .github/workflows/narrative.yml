name: Chiefs Narrative (daily)

# Regenerates the Chiefs Narrative every morning, refreshes the published
# schedule more often (evenings and late game windows), opens an automated
# pull request, auto-merges it, and deploys the refreshed site to GitHub Pages.
#
# Schedule freshness does not depend on narrative text changing: a score-only
# or kickoff/network update still commits data/schedule_2026.json and deploys.
# Evening / late-window runs are --schedule-only so they do not mint a new
# narrative edition.
#
# Providers (auto-detected in tools/chiefs_narrative/providers.py):
#   * If the XAI_API_KEY (or GROK_API_KEY) secret exists -> Grok writes it.
#   * Else if OPENAI_API_KEY exists -> OpenAI writes it.
#   * Otherwise the deterministic offline writer produces a complete, cited edition.
# Nothing is required for this to run; add XAI_API_KEY or OPENAI_API_KEY (and
# optionally ODDS_API_KEY) as repository secrets to upgrade the writing.
# Optional repository variable GROK_MODEL selects the xAI model (default grok-4.6).
# Force one with the workflow_dispatch "provider" input (e.g. grok).

on:
  schedule:
    # ~6:10 AM Central — overnight news + full narrative + slate.
    - cron: "10 11 * * *"
    # ~11:20 PM CDT / 10:20 PM CST — after afternoon/TNF/Saturday kickoffs.
    - cron: "20 4 * * *"
    # ~2:20 AM CDT Sun/Mon/Tue — after Saturday, SNF, and Monday Night windows.
    - cron: "20 7 * * 0,1,2"
  workflow_dispatch:
    inputs:
      provider:
        description: "Force writer (blank = auto). grok|openai|anthropic|offline"
        required: false
        default: ""
      mode:
        description: "full = narrative + slate; schedule = slate only"
        required: false
        default: "full"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: chiefs-narrative
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r tools/requirements.txt

      - name: Decide desk mode
        id: mode
        run: |
          MODE="schedule"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.mode }}" != "schedule" ]; then
              MODE="full"
            fi
          elif [ "${{ github.event.schedule }}" = "10 11 * * *" ]; then
            MODE="full"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Desk mode: $MODE"

      - name: Refresh the published slate
        run: python -m tools.chiefs_narrative.generate --schedule-only

      - name: Generate the Chiefs Narrative
        if: steps.mode.outputs.mode == 'full'
        env:
          CHIEFS_PROVIDER: ${{ github.event.inputs.provider }}
          # Grok/xAI takes precedence over OpenAI when its key is present.
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          GROK_MODEL: ${{ vars.GROK_MODEL }}
          XAI_BASE_URL: ${{ vars.XAI_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python - <<'PY'
          from tools.chiefs_narrative.providers import grok_model
          print(f"GROK_MODEL env={__import__('os').environ.get('GROK_MODEL', '')!r}")
          print(f"resolved grok model={grok_model()}")
          PY
          python -m tools.chiefs_narrative.generate

      - name: Detect changes
        id: diff
        run: |
          git add -A data public/images/narrative
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No slate or narrative changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat
          fi

      - name: Open and auto-merge pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DESK_MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          BASE="${GITHUB_REF_NAME}"
          STAMP="$(date -u +%Y%m%d-%H%M)"
          BRANCH="narrative/update-${STAMP}"

          git config user.name "arrowhead-paesano-bot"
          git config user.email "actions@github.com"
          git checkout -b "$BRANCH"

          if [ "$DESK_MODE" = "full" ] && [ -f data/narrative.json ]; then
            EDITION="$(python -c "import json;print(json.load(open('data/narrative.json'))['edition'])")"
            HEADLINE="$(python -c "import json;print(json.load(open('data/narrative.json'))['headline'])")"
            git commit -m "Chiefs Narrative: ${EDITION}" -m "${HEADLINE}"
            TITLE="Chiefs Narrative — ${EDITION}"
            BODY="$(printf '%s\n' \
              "Automated refresh of the Chiefs Narrative and 2026 slate." \
              "" \
              "**${HEADLINE}**" \
              "" \
              "- Regenerated data/narrative.json + archive from the live schedule, news wire, model projection, Vegas line and prediction markets." \
              "- Wrote data/schedule_2026.json from ESPN (kickoffs in CT, networks, venues, final scores when ESPN has them)." \
              "- Re-rendered the X's-and-O's diagrams." \
              "" \
              "Generated by the Chiefs Narrative (daily) workflow.")"
          else
            git commit -m "Chiefs schedule: refresh 2026 slate"
            TITLE="Chiefs schedule — ${STAMP}"
            BODY="$(printf '%s\n' \
              "Automated schedule-only refresh. Narrative text was not regenerated." \
              "" \
              "- Updated data/schedule_2026.json from the live ESPN slate (or the last good file if ESPN was down)." \
              "- Kickoffs stay in America/Chicago. Scores are published only when ESPN reports them." \
              "" \
              "Generated by the Chiefs Narrative (daily) workflow.")"
          fi

          git push origin "$BRANCH"

          PR_URL="$(gh pr create --base "$BASE" --head "$BRANCH" \
            --title "$TITLE" --body "$BODY")"

          echo "Opened $PR_URL"
          # Prefer GitHub auto-merge; fall back to an immediate squash merge.
          gh pr merge "$PR_URL" --squash --auto --delete-branch \
            || gh pr merge "$PR_URL" --squash --delete-branch

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages-publish
      cancel-in-progress: false
    env:
      HUGO_VERSION: 0.152.2
    steps:
      - name: Checkout (post-merge default branch)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install Hugo
        run: |
          curl -fsSL --output "${{ runner.temp }}/hugo.tar.gz" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xf "${{ runner.temp }}/hugo.tar.gz"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

      - name: Build
        run: |
          git pull --ff-only origin "${GITHUB_REF_NAME}" || true
          hugo --gc --minify
          touch dist/.nojekyll

      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist
          git init -q -b gh-pages
          git config user.name "arrowhead-paesano-bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -q -m "Deploy narrative ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages:gh-pages
