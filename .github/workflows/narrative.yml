name: Chiefs Narrative (daily)

# Regenerates the Chiefs Narrative every morning as a three-act desk:
# last-game review, current state / work list, then next-game plan and
# matchup. Also refreshes the published schedule more often (evenings and
# late game windows) and opens a draft PR to develop. Jobs check out
# develop, not the default-branch trigger on main: scheduled runs live on
# main, and after a squash-promote the histories diverge, so a branch cut
# from main conflicts with develop on the live edition files. A maintainer
# approves any queued PR-event workflow, reviews the edition, and promotes
# develop to main. pages.yml remains the deployment path after that
# reviewed merge. The checkout pin must be on main before the next
# scheduled run, or tomorrow's PR will conflict the same way.
#
# Install and tests run in a contents:read job with persist-credentials:
# false. Only the final update job gets contents:write; it
# commit generated data and never run unittest or pip install -r.
#
# Schedule freshness does not depend on narrative text changing: a score-only
# or kickoff/network update still queues data/schedule_2026.json for review.
# Evening / late-window runs are --schedule-only so they do not mint a new
# narrative edition.
#
# Article jobs default to Grok/xAI with the existing XAI_API_KEY/GROK_API_KEY.
# An explicitly selected manual provider retains its own existing ecosystem.
# Schedule-only jobs do not need any provider secret.
# Article jobs pin grok-4.7. Bumps go through a PR so latency can be checked.
# Provider/model failures stop generation; they never downgrade the article writer.
# Force one with the workflow_dispatch "provider" input (e.g. grok).

on:
  schedule:
    # ~4:37 AM CDT / 3:37 AM CST — overnight news + full narrative + slate.
    # Earlier, off-peak minute so GitHub is less likely to start the run hours late.
    - cron: "37 9 * * *"
    # ~10:43 PM CDT / 9:43 PM CST — after afternoon/TNF/Saturday kickoffs.
    - cron: "43 3 * * *"
    # ~2:20 AM CDT Sun/Mon/Tue — after Saturday, SNF, and Monday Night windows.
    - cron: "20 7 * * 0,1,2"
  workflow_dispatch:
    inputs:
      provider:
        description: "Force writer (blank = grok). grok|openai|anthropic|offline"
        required: false
        default: ""
      mode:
        description: "full = narrative + slate; schedule = slate only"
        required: false
        default: "full"
  pull_request:
    types: [ready_for_review, labeled, unlabeled, reopened, synchronize]
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: chiefs-narrative
  cancel-in-progress: false

jobs:
  generate:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      contents: read
      pull-requests: read
    env:
      HUGO_VERSION: 0.152.2
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r tools/requirements.txt

      - name: Decide desk mode
        id: mode
        run: |
          MODE="schedule"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.mode }}" != "schedule" ]; then
              MODE="full"
            fi
          elif [ "${{ github.event.schedule }}" = "37 9 * * *" ]; then
            MODE="full"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Desk mode: $MODE"

      - name: Check queued publications before provider work
        id: queue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DESK_MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          python -m tools.chiefs_narrative.publication_queue

      - name: Refresh the published slate
        if: steps.queue.outputs.pending != 'true'
        run: python -m tools.chiefs_narrative.generate --schedule-only

      - name: Skip publish while a Chiefs game is live
        id: live
        if: steps.queue.outputs.pending != 'true'
        run: |
          python - <<'PY'
          import os
          from tools.chiefs_narrative import collect, phase
          games = collect.load_cached_schedule()
          skip = phase.any_live(games)
          print(f"live={skip}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"skip={'true' if skip else 'false'}\n")
          if skip:
              print("Chiefs game is live; skipping new edition and PR.")
          PY

      - name: Generate the Chiefs Narrative
        if: steps.queue.outputs.pending != 'true' && steps.mode.outputs.mode == 'full' && steps.live.outputs.skip != 'true'
        env:
          CHIEFS_PROVIDER: ${{ github.event.inputs.provider || 'grok' }}
          # Grok/xAI takes precedence over OpenAI when its key is present.
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          # Repo variables must not silently pin old models or configure downgrades.
          GROK_MODEL: grok-4.7
          GROK_REASONING_EFFORT: ${{ vars.GROK_REASONING_EFFORT || 'low' }}
          XAI_BASE_URL: ${{ vars.XAI_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # Stream cap in seconds. Default 600; the run-wide LLM budget is 6 calls.
          LLM_DEADLINE: ${{ vars.LLM_DEADLINE || '600' }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -m tools.chiefs_narrative.generate

      - name: Pull a verified X photograph
        if: steps.queue.outputs.pending != 'true' && steps.mode.outputs.mode == 'full' && steps.live.outputs.skip != 'true'
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          GROK_MODEL: grok-4.7
          XAI_BASE_URL: ${{ vars.XAI_BASE_URL }}
          PYTHONUNBUFFERED: "1"
        run: |
          # Always exit 0. A missing or rejected photo must not hold the edition.
          python -m tools.chiefs_narrative.generate --pull-photo

      - name: Detect changes
        id: diff
        run: |
          if [ "${{ steps.queue.outputs.pending }}" = "true" ] || [ "${{ steps.live.outputs.skip }}" = "true" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Publication queued or Chiefs game in progress; skipping new PR."
            exit 0
          fi
          git add -- \
            data/narrative.json \
            data/narrative_archive.json \
            data/narrative_repair.json \
            data/narrative_editions \
            data/wire.json \
            data/schedule_2026.json \
            data/hero_posts.json \
            data/x-photo \
            public/images/narrative \
            public/images/x-photo
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No slate or narrative changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat
          fi

      - name: Upload generated data
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: narrative-data
          path: |
            data/narrative.json
            data/narrative_archive.json
            data/narrative_repair.json
            data/narrative_editions
            data/wire.json
            data/schedule_2026.json
            public/images/narrative
            public/images/x-photo

  test:
    needs: generate
    if: github.event_name != 'pull_request' && needs.generate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      HUGO_VERSION: 0.152.2
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false

      - name: Download generated data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: narrative-data
          path: .

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r tools/requirements.txt

      - name: Install Hugo
        run: |
          curl -fsSL --output "${{ runner.temp }}/hugo.tar.gz" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xf "${{ runner.temp }}/hugo.tar.gz"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

      - name: Gate generated content
        run: |
          set -euo pipefail
          python -m unittest discover -s tools/tests -v
          python -m tools.chiefs_narrative.generate --gate-replay
          check_rc=0
          python -m tools.chiefs_narrative.generate --check-edition || check_rc=$?
          if [ "$check_rc" -ne 0 ]; then
            echo "check-edition still has unfixable issues; holding automerge"
            python - <<'PY'
          import json
          from pathlib import Path
          path = Path("data/narrative_repair.json")
          payload = {}
          if path.is_file():
              try:
                  loaded = json.loads(path.read_text(encoding="utf-8"))
              except json.JSONDecodeError:
                  loaded = {}
              if isinstance(loaded, dict):
                  payload = loaded
          payload["holdAutomerge"] = True
          path.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY
          fi
          python -m tools.chiefs_narrative.generate --diagrams-only
          git diff --exit-code -- public/images/narrative
          hugo --gc --minify
          pages_rc=0
          python -m tools.chiefs_narrative.review_gate --pages --dist dist || pages_rc=$?
          if [ "$pages_rc" -eq 2 ]; then
            echo "unsigned Review edition; pages gate holds deploy (exit 2)"
          elif [ "$pages_rc" -ne 0 ]; then
            exit "$pages_rc"
          fi

      - name: Record publish metadata
        env:
          DESK_MODE: ${{ needs.generate.outputs.mode }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.chiefs_narrative import drop_body, facts
          repair = {}
          repair_path = Path("data/narrative_repair.json")
          if repair_path.is_file():
              try:
                  loaded = json.loads(repair_path.read_text(encoding="utf-8"))
              except json.JSONDecodeError:
                  loaded = {}
              if isinstance(loaded, dict):
                  repair = loaded
          narrative = {}
          live = Path("data/narrative.json")
          if live.is_file():
              try:
                  loaded = json.loads(live.read_text(encoding="utf-8"))
              except json.JSONDecodeError:
                  loaded = {}
              if isinstance(loaded, dict):
                  narrative = loaded
          hold = bool(repair.get("holdAutomerge"))
          if facts.review_requires_human(narrative):
              hold = True
          meta = {
              "mode": __import__("os").environ.get("DESK_MODE") or "schedule",
              "holdMerge": hold,
              "dropBody": drop_body.drop_body(repair),
              "edition": str(narrative.get("edition") or ""),
              "headline": str(narrative.get("headline") or ""),
          }
          Path(".narrative-publish.json").write_text(
              json.dumps(meta, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload validated data
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: narrative-publish
          include-hidden-files: true
          path: |
            data/narrative.json
            data/narrative_archive.json
            data/narrative_repair.json
            data/narrative_editions
            data/wire.json
            data/schedule_2026.json
            public/images/narrative
            public/images/x-photo
            .narrative-publish.json

      - name: Fail held editions
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          path = Path(".narrative-publish.json")
          meta = {}
          if path.is_file():
              try:
                  loaded = json.loads(path.read_text(encoding="utf-8"))
              except json.JSONDecodeError:
                  loaded = {}
              if isinstance(loaded, dict):
                  meta = loaded
          if meta.get("holdMerge"):
              print("held edition; failing the run", file=sys.stderr)
              sys.exit(1)
          PY

  update:
    needs: [generate, test]
    # !cancelled() is required: a bare needs.*.result read gets an implicit
    # success() from GitHub, which skips this job when test fails (held
    # editions). always()/failure() would also cancel the implicit wrap.
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.generate.outputs.changed == 'true' && (needs.test.result == 'success' || needs.test.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false

      - name: Download validated data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: narrative-publish
          path: .

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Refuse unsigned Review editions
        run: |
          set -euo pipefail
          git fetch --no-tags origin develop
          GATE_BASE="${RUNNER_TEMP}/gate-base"
          git worktree add --detach "$GATE_BASE" "origin/develop"
          cd "$GATE_BASE"
          pages_rc=0
          PYTHONPATH="$GATE_BASE" python -P -m tools.chiefs_narrative.review_gate --pages \
            --root "${GITHUB_WORKSPACE}" || pages_rc=$?
          if [ "$pages_rc" -eq 2 ]; then
            echo "Unsigned Review edition; continuing to a held PR"
          elif [ "$pages_rc" -ne 0 ]; then
            exit "$pages_rc"
          fi

      - name: Queue draft pull request for approved PR-event gates
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DESK_MODE: ${{ needs.generate.outputs.mode }}
        run: |
          set -euo pipefail
          BASE="develop"
          STAMP="$(date -u +%Y%m%d-%H%M)"
          BRANCH="narrative/update-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          git config user.name "arrowhead-paesano-bot"
          git config user.email "actions@github.com"
          git add -- \
            data/narrative.json \
            data/narrative_archive.json \
            data/narrative_repair.json \
            data/narrative_editions \
            data/wire.json \
            data/schedule_2026.json \
            data/hero_posts.json \
            data/x-photo \
            public/images/narrative \
            public/images/x-photo
          git checkout -b "$BRANCH"

          HOLD_MERGE="false"
          DROP_BODY=""
          if [ -f .narrative-publish.json ]; then
            HOLD_MERGE="$(python -P -c "import json;print('true' if json.load(open('.narrative-publish.json')).get('holdMerge') else 'false')")"
            DROP_BODY="$(python -P -c "import json;print(json.load(open('.narrative-publish.json')).get('dropBody') or '')")"
          fi
          if [ "$HOLD_MERGE" != "true" ] && [ "$DESK_MODE" = "full" ] && [ -f data/narrative.json ]; then
            REVIEW_HOLD="$(python -P -c "import json;print('true' if json.load(open('.narrative-publish.json')).get('holdMerge') else 'false')")"
            if [ "$REVIEW_HOLD" = "true" ]; then
              HOLD_MERGE="true"
            fi
          fi

          if [ "$DESK_MODE" = "full" ] && [ -f data/narrative.json ]; then
            EDITION="$(python -P -c "import json;print(json.load(open('.narrative-publish.json')).get('edition') or json.load(open('data/narrative.json'))['edition'])")"
            HEADLINE="$(python -P -c "import json;print(json.load(open('.narrative-publish.json')).get('headline') or json.load(open('data/narrative.json'))['headline'])")"
            git commit -m "Chiefs Narrative: ${EDITION}" -m "${HEADLINE}"
            TITLE="Chiefs Narrative — ${EDITION}"
            BODY="$(printf '%s\n' \
              "Automated refresh of the Chiefs Narrative and 2026 slate." \
              "" \
              "**${HEADLINE}**" \
              "" \
              "- Regenerated data/narrative.json + archive: last-game review (ESPN recap + wire), current state / work list, and next-game plan + matchup, plus the live schedule, news wire, model projection, Vegas line and prediction markets." \
              "- Wrote data/schedule_2026.json from ESPN (kickoffs in CT, networks, venues, final scores when ESPN has them)." \
              "- Re-rendered the X's-and-O's diagrams." \
              "" \
              "${DROP_BODY}" \
              "" \
              "Generated by the Chiefs Narrative (daily) workflow.")"
          else
            git commit -m "Chiefs schedule: refresh 2026 slate"
            TITLE="Chiefs schedule — ${STAMP}"
            BODY="$(printf '%s\n' \
              "Automated schedule-only refresh. Narrative text was not regenerated." \
              "" \
              "- Updated data/schedule_2026.json from the live ESPN slate (or the last good file if ESPN was down)." \
              "- Kickoffs stay in America/Chicago. Scores are published only when ESPN reports them." \
              "" \
              "Generated by the Chiefs Narrative (daily) workflow.")"
          fi

          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"

          BODY_FILE="${RUNNER_TEMP}/narrative-pr-body.md"
          printf '%s\n\n%s\n' "$BODY" \
            "Draft for human review. Approve any waiting pull_request workflow in Actions, then require the real gates check. Promote validated develop to main through a reviewed PR; pages.yml deploys main. Review editions still require Karen's signed PASS." > "$BODY_FILE"
          PR_URL="$(gh pr create --draft --base "$BASE" --head "$BRANCH" \
            --title "$TITLE" --body-file "$BODY_FILE")"

          echo "Opened $PR_URL"

          if [ "$HOLD_MERGE" = "true" ]; then
            echo "Holding automerge: review requires human QA, leftover issues, or noisy salvage (listed in the PR body)."
            gh pr edit "$PR_URL" --add-label hold || true
          fi

          echo "Queued $PR_URL for approved PR-event gates and edition auto-merge/promote."
          echo "### Publication queued" >> "$GITHUB_STEP_SUMMARY"
          echo "$PR_URL — draft on develop. Approve any waiting PR workflow in Actions. Auto-merge and promote refuse a hold label or unresolved review findings." >> "$GITHUB_STEP_SUMMARY"

  publish:
    # Ready narrative/update-* PRs to develop. Refuse hold or open review
    # findings; otherwise squash-merge to develop and promote to main.
    if: >-
      ${{ github.event_name == 'pull_request' &&
          github.base_ref == 'develop' &&
          startsWith(github.head_ref, 'narrative/update-') &&
          github.event.pull_request.draft == false &&
          github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Refuse hold or unresolved review findings
        id: refuse
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin develop
          GATE_BASE="${RUNNER_TEMP}/gate-base"
          git worktree add --detach "$GATE_BASE" "origin/develop"
          cd "$GATE_BASE"
          if ! PYTHONPATH="$GATE_BASE" python -P -m tools.chiefs_narrative.edition_merge \
            --pr "${{ github.event.pull_request.html_url }}"; then
            echo "Refusing edition auto-merge and promote: hold label or unresolved review findings"
            echo "refused=true" >> "$GITHUB_OUTPUT"
            gh pr merge "${{ github.event.pull_request.html_url }}" --disable-auto || true
            exit 1
          fi
          echo "refused=false" >> "$GITHUB_OUTPUT"

      - name: Squash-merge the edition pull request
        if: steps.refuse.outputs.refused != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh pr merge "${{ github.event.pull_request.html_url }}" \
            --squash --auto \
            --match-head-commit ${{ github.event.pull_request.head.sha }} \
            || gh pr merge "${{ github.event.pull_request.html_url }}" \
              --squash \
              --match-head-commit ${{ github.event.pull_request.head.sha }}

      - name: Promote develop to main
        if: steps.refuse.outputs.refused != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin develop
          GATE_BASE="${RUNNER_TEMP}/gate-base"
          if [ ! -d "$GATE_BASE" ]; then
            git worktree add --detach "$GATE_BASE" "origin/develop"
          fi
          TITLE="$(gh pr view "${{ github.event.pull_request.html_url }}" --json title --jq .title)"
          PROMOTE_TITLE="Promote develop to main: ${TITLE}"
          BODY_FILE="${RUNNER_TEMP}/narrative-promote-body.md"
          printf '%s\n' \
            "Promotes ${{ github.event.pull_request.html_url }}." \
            "Merge, not squash." > "$BODY_FILE"
          # Title match in jq --arg, not PR-head Python. PROMOTE_TITLE is
          # always prefixed, so an empty-title shell guard is dead code.
          EXISTING="$(gh pr list --base main --head develop --state open --json url,title \
            | jq -r --arg t "$PROMOTE_TITLE" \
              '.[] | select(.title == $t) | .url | select(test("^https?://"))' \
            | head -n 1)"
          cd "$GATE_BASE"
          if ! PYTHONPATH="$GATE_BASE" python -P -m tools.chiefs_narrative.edition_merge \
            --pr "${{ github.event.pull_request.html_url }}"; then
            echo "Refusing promote: hold label or unresolved review findings"
            if [ -n "$EXISTING" ]; then
              gh pr close "$EXISTING" --comment "Refusing promote: hold or unresolved review findings"
            fi
            exit 1
          fi
          PROMOTE_URL="$(gh pr list --base main --head develop --state open --json url,title \
            | jq -r --arg t "$PROMOTE_TITLE" \
              '.[] | select(.title == $t) | .url | select(test("^https?://"))' \
            | head -n 1)"
          if [ -z "$PROMOTE_URL" ]; then
            PROMOTE_URL="$(gh pr create --base main --head develop \
              --title "$PROMOTE_TITLE" \
              --body-file "$BODY_FILE")"
          fi
          if ! PYTHONPATH="$GATE_BASE" python -P -m tools.chiefs_narrative.edition_merge \
            --pr "${{ github.event.pull_request.html_url }}"; then
            echo "Refusing promote: hold label or unresolved review findings"
            gh pr close "$PROMOTE_URL" --comment "Refusing promote: hold or unresolved review findings"
            exit 1
          fi
          gh pr merge "$PROMOTE_URL" --merge --auto \
            || gh pr merge "$PROMOTE_URL" --merge
          gh workflow run "Deploy Hugo site to GitHub Pages" \
            --repo "${GITHUB_REPOSITORY}" --ref main
