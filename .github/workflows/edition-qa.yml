name: Edition gates (human)

# Human data-only PRs match ci.yml paths-ignore, so that workflow never
# starts. Bot edition PRs stay on narrative.yml + workflow_dispatch.
# This workflow is pull_request_target only so github-actions[bot] does
# not sit on first-time approval. Never execute PR code. Tools, tests,
# fixtures, and requirements come from the base (main). Only edition
# data files are copied from the PR head, then discarded.

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "data/narrative.json"
      - "data/narrative_archive.json"
      - "data/narrative_repair.json"
      - "data/narrative_editions/**"
      - "data/wire.json"
      - "data/schedule_2026.json"
      - "public/images/narrative/**"

permissions:
  contents: read

concurrency:
  group: edition-qa-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  HUGO_VERSION: 0.152.2
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  edition-gates:
    if: >-
      ${{ github.actor != 'github-actions[bot]' &&
          github.event.pull_request.user.login != 'github-actions[bot]' &&
          !startsWith(github.head_ref, 'narrative/update-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout main tools
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Fetch PR head history
        run: |
          set -euo pipefail
          git fetch --no-tags --prune --no-recurse-submodules \
            "${{ github.event.pull_request.head.repo.clone_url }}" \
            "+${{ github.event.pull_request.head.sha }}:refs/tmp/pr-head"

      - name: Fetch PR edition data (no execute)
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          path: .pr-head

      - name: Overlay edition data from the PR head
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -B -m tools.chiefs_narrative.edition_overlay .pr-head . \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}"

      - name: Stage overlaid edition files
        run: git add -A -- data public/images/narrative

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r tools/requirements.txt

      - name: Install Hugo
        run: |
          curl -fsSL --output "${{ runner.temp }}/hugo.tar.gz" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xf "${{ runner.temp }}/hugo.tar.gz"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

      - name: Gate 1 — narrative engine tests
        run: python -m unittest discover -s tools/tests -v

      - name: Fact-check the published edition
        run: python -m tools.chiefs_narrative.generate --check-edition

      - name: Render XO diagrams from narrative.json
        run: python -m tools.chiefs_narrative.generate --diagrams-only

      - name: Fail if the render rewrote overlaid SVGs
        run: git diff --quiet -- public/images/narrative && test -z "$(git ls-files --others --exclude-standard -- public/images/narrative)"

      - name: Gate 2 — Hugo build
        run: hugo --gc --minify

  automerge:
    needs: edition-gates
    if: >-
      ${{ github.actor != 'github-actions[bot]' &&
          github.event.pull_request.user.login != 'github-actions[bot]' &&
          !startsWith(github.head_ref, 'narrative/update-') &&
          github.event.pull_request.draft == false &&
          !contains(github.event.pull_request.labels.*.name, 'hold') &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                   github.event.pull_request.author_association) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Squash-merge the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh pr merge "${{ github.event.pull_request.html_url }}" \
            --squash --auto --delete-branch \
            --match-head-commit ${{ github.event.pull_request.head.sha }} \
            || gh pr merge "${{ github.event.pull_request.html_url }}" \
              --squash --delete-branch \
              --match-head-commit ${{ github.event.pull_request.head.sha }}

      - name: Trigger Pages deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run "Deploy Hugo site to GitHub Pages" \
            --repo "${GITHUB_REPOSITORY}" --ref main
