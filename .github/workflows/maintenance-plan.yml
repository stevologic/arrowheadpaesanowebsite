name: Read-only repository maintenance
on:
  workflow_dispatch:
  schedule:
    - cron: '43 13 * * 1'
  pull_request:
    branches: [main, develop]
    paths: ['.github/maintenance.json', '.github/workflows/maintenance-plan.yml', 'docs/shared-maintenance-consumer.md']
  push:
    branches: [main, develop]
    paths: ['.github/maintenance.json', '.github/workflows/maintenance-plan.yml', 'docs/shared-maintenance-consumer.md']
permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: read
  statuses: read
  actions: read
concurrency:
  group: maintenance-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Inventory source-safe metadata without model or operations
        uses: stevologic/oss-deps-explorer/actions/maintenance@889114d54cc62597c7902dca7286acd6663cd132 # reviewed1.1.2
        with:
          config: .github/maintenance.json
          token: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: read-only-maintenance-${{ github.run_id }}
          path: maintenance-report/
          retention-days: 14
          if-no-files-found: error
