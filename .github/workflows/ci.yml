name: CI gates

# Every pull request against main runs the merge gates:
#   1. Python unit tests for the Chiefs Narrative engine (offline, no keys).
#   2. A full Hugo build with the exact production version.
# If both gates pass and the PR is not a draft (and not labeled "hold"),
# the PR is squash-merged into main automatically. Merging to main then
# triggers the Pages deploy workflow as usual.
#
# The daily narrative bot's own PRs (narrative/update-*) are excluded —
# that workflow already merges its own work.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  HUGO_VERSION: 0.152.2

jobs:
  gates:
    if: ${{ !startsWith(github.head_ref, 'narrative/update-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r tools/requirements.txt

      - name: Gate 1 — narrative engine tests
        run: python -m unittest discover -s tools/tests -v

      - name: Install Hugo
        run: |
          curl -fsSL --output "${{ runner.temp }}/hugo.tar.gz" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xf "${{ runner.temp }}/hugo.tar.gz"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

      - name: Gate 2 — Hugo build
        run: hugo --gc --minify

  automerge:
    needs: gates
    if: >-
      ${{ !startsWith(github.head_ref, 'narrative/update-') &&
          github.event.pull_request.draft == false &&
          !contains(github.event.pull_request.labels.*.name, 'hold') }}
    runs-on: ubuntu-latest
    steps:
      - name: Squash-merge the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Prefer GitHub auto-merge; fall back to an immediate squash merge.
          gh pr merge "${{ github.event.pull_request.html_url }}" \
            --squash --auto --delete-branch \
            || gh pr merge "${{ github.event.pull_request.html_url }}" \
              --squash --delete-branch
