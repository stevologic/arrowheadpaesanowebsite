name: CI gates

# Every pull request against main runs the merge gates:
#   1. Python unit tests for the Chiefs Narrative engine (offline, no keys).
#   2. A full Hugo build with the exact production version.
# If both gates pass and the PR is not a draft (and not labeled "hold"),
# the PR is squash-merged into main automatically. Merging to main then
# triggers the Pages deploy workflow as usual.
#
# Edition PRs opened with GITHUB_TOKEN never start pull_request workflows
# (run 36360998269 / #110). The daily job therefore dispatches this file
# against the edition branch (workflow_dispatch) or calls it
# (workflow_call). Automerge stays off for narrative/update-* and for
# any non-pull_request event — narrative.yml waits for this gates job,
# then merges.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout_ref:
        description: "Branch or SHA to gate (edition branch)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ci-${{ github.event.pull_request.number || inputs.checkout_ref || github.ref }}
  cancel-in-progress: true

env:
  HUGO_VERSION: 0.152.2

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r tools/requirements.txt

      - name: Install Hugo
        run: |
          curl -fsSL --output "${{ runner.temp }}/hugo.tar.gz" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xf "${{ runner.temp }}/hugo.tar.gz"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

      - name: Gate 1 — narrative engine tests
        run: python -m unittest discover -s tools/tests -v

      - name: Gate 2 — Hugo build
        run: hugo --gc --minify

  automerge:
    needs: gates
    # Only human/PAT pull_request events. workflow_dispatch / workflow_call
    # have no pull_request payload — do not invent a merge.
    # Edition PRs are merged by narrative.yml after this gates job succeeds.
    if: >-
      ${{ github.event_name == 'pull_request' &&
          !startsWith(github.head_ref, 'narrative/update-') &&
          github.event.pull_request.draft == false &&
          !contains(github.event.pull_request.labels.*.name, 'hold') }}
    runs-on: ubuntu-latest
    steps:
      - name: Squash-merge the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Prefer GitHub auto-merge; fall back to an immediate squash merge.
          gh pr merge "${{ github.event.pull_request.html_url }}" \
            --squash --auto --delete-branch \
            || gh pr merge "${{ github.event.pull_request.html_url }}" \
              --squash --delete-branch
