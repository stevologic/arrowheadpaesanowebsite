name: CI gates

# Feature PRs and develop pushes validate before a reviewed promotion to main.
#   1. Python unit tests for the Chiefs Narrative engine (offline, no keys).
#   2. A full Hugo build with the exact production version.
# If both gates pass and the PR is not a draft (and not labeled "hold"),
# the PR is squash-merged into main automatically. A GITHUB_TOKEN merge
# does not fire pages.yml's push trigger, so automerge then dispatches
# "Deploy Hugo site to GitHub Pages" on main.
#
# Every PR, including edition-only and bot PRs, needs the real PR-event
# gates check. GITHUB_TOKEN-created PR runs may require a maintainer to
# approve workflows. Dispatch checks cannot satisfy branch protection;
# neither paths nor branch prefixes may silently skip the required job.

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [develop]
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout_ref:
        description: "Branch or SHA to gate (edition branch)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HUGO_VERSION: 0.152.2

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch develop for edition diffs
        run: git fetch --no-tags origin develop

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r tools/requirements.txt

      - name: Publication compatibility download retry harness
        run: python -m tools.tests.run_publication_compatibility_download_harness

      - name: Gate 0 — workflow YAML parses
        run: python -m tools.chiefs_narrative.check_workflows

      - name: Install Hugo
        run: |
          curl -fsSL --output "${{ runner.temp }}/hugo.tar.gz" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xf "${{ runner.temp }}/hugo.tar.gz"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

      - name: Gate 1 — narrative engine tests
        run: python -m unittest discover -s tools/tests -v

      - name: Fact-check the published edition
        run: python -m tools.chiefs_narrative.generate --check-edition

      - name: Render XO diagrams from narrative.json
        run: python -m tools.chiefs_narrative.generate --diagrams-only

      - name: Fail if the render rewrote committed SVGs
        run: git diff --exit-code -- public/images/narrative

      - name: Gate 2 — Hugo build
        run: hugo --gc --minify

      - name: Set up local tooling Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Validate local build dependency manifest
        run: npm ci --ignore-scripts

      - name: Reject moderate or worse tooling advisories
        run: npm audit --audit-level=moderate

      - name: Verify the upgraded local Hugo installer and build
        run: |
          set -euo pipefail
          npm rebuild hugo-bin --foreground-scripts
          version="$(node_modules/.bin/hugo version)"
          echo "$version"
          [[ "$version" == "hugo v${HUGO_VERSION}"*+extended* ]]
          npm run build

      - name: Verify affiliate footer activation and link guards
        run: npm run check:affiliates

      # Exercise the v4 ZIP -> v8 download contract used by narrative.yml,
      # including its hidden metadata, without generating or publishing content.
      - name: Prepare publication artifact compatibility fixture
        run: |
          python - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'artifact-original'
          root.mkdir()
          sources = [Path('data/narrative.json'), Path('data/schedule_2026.json'),
                     next(iter(sorted(Path('public/images/narrative').rglob('*.svg'))))]
          for source in sources:
              target = root / source
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, target)
          (root / '.narrative-publish.json').write_text(
              json.dumps({'mode': 'schedule', 'holdMerge': True}) + '\n', encoding='utf-8')
          manifest = {str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest()
                      for p in root.rglob('*') if p.is_file()}
          (root.parent / 'artifact-hashes.json').write_text(json.dumps(manifest), encoding='utf-8')
          PY

      - name: Upload publication compatibility fixture
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication-compatibility
          include-hidden-files: true
          retention-days: 1
          path: ${{ runner.temp }}/artifact-original/

      - name: Download publication compatibility fixture
        timeout-minutes: 3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m tools.chiefs_narrative.download_publication_compatibility --run-id "${{ github.run_id }}" --dest "${{ runner.temp }}/artifact-roundtrip/"

      - name: Verify publication artifact bytes and hidden metadata
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          temp = Path(os.environ['RUNNER_TEMP'])
          root = temp / 'artifact-roundtrip'
          actual = {str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest()
                    for p in root.rglob('*') if p.is_file()}
          expected = json.loads((temp / 'artifact-hashes.json').read_text(encoding='utf-8'))
          assert actual == expected, f'Publication artifact changed: {actual.keys()} != {expected.keys()}'
          assert '.narrative-publish.json' in actual
          PY

      - name: Pages and narrative deploy gates on the real tree
        run: |
          set -euo pipefail
          # Same command as pages.yml / narrative.yml against this checkout.
          run_gate() {
            local out="$1"
            if python -m tools.chiefs_narrative.review_gate --pages --dist dist; then
              echo "skip=false" >> "$out"
            else
              rc=$?
              if [ "$rc" -eq 2 ]; then
                echo "skip=true" >> "$out"
                echo "Unsigned Review edition; skipping gh-pages deploy"
              else
                exit "$rc"
              fi
            fi
          }
          pages_out="${RUNNER_TEMP:-/tmp}/pages.skip"
          narr_out="${RUNNER_TEMP:-/tmp}/narr.skip"
          : > "$pages_out"
          : > "$narr_out"
          run_gate "$pages_out"
          run_gate "$narr_out"
          echo "pages.yml: $(cat "$pages_out")"
          echo "narrative.yml: $(cat "$narr_out")"
          grep -qx "skip=false" "$pages_out"
          grep -qx "skip=false" "$narr_out"

  automerge:
    needs: gates
    # Write token is only on this job. The gates job inherits contents:read
    # and checks out with persist-credentials: false so PR tests cannot push.
    permissions:
      contents: write
      pull-requests: write
      actions: write
    # Only human/PAT pull_request events. workflow_dispatch / workflow_call
    # have no pull_request payload — do not invent a merge.
    # Generated edition PRs stay draft on develop for human review/promotion.
    if: >-
      ${{ github.event_name == 'pull_request' &&
          github.base_ref == 'main' &&
          github.head_ref != 'develop' &&
          github.actor != 'dependabot[bot]' &&
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          github.actor != 'github-actions[bot]' &&
          github.event.pull_request.user.login != 'github-actions[bot]' &&
          !startsWith(github.head_ref, 'narrative/update-') &&
          github.event.pull_request.draft == false &&
          !contains(github.event.pull_request.labels.*.name, 'hold') &&
          github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Fetch PR head as git objects
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_CLONE: ${{ github.event.pull_request.head.repo.clone_url }}
        run: |
          set -euo pipefail
          git fetch --no-tags --prune --no-recurse-submodules \
            "$HEAD_CLONE" "+${HEAD_SHA}:refs/tmp/pr-head"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Refuse unsigned Review editions
        id: gate
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF"
          git fetch --no-tags origin +refs/heads/develop:refs/remotes/origin/develop
          GATE_BASE="${RUNNER_TEMP}/gate-base"
          git worktree add --detach "$GATE_BASE" "origin/${BASE_REF}"
          # cwd + python -m would import PR-head tools/ (sys.path[0]).
          # -P keeps cwd off sys.path; the module comes from GATE_BASE only.
          # --root is the git dir; head is read as objects, never imported.
          cd "$GATE_BASE"
          PYTHONPATH="$GATE_BASE" python -P -m tools.chiefs_narrative.review_gate --automerge \
            --base "origin/${BASE_REF}" \
            --head "$HEAD_SHA" \
            --head-ref "$HEAD_REF" \
            --develop-ref origin/develop \
            --fetch-develop \
            --github-output "$GITHUB_OUTPUT" \
            --root "${GITHUB_WORKSPACE}"

      - name: Re-verify against develop
        id: reverify
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
          PINNED_DEVELOP_SHA: ${{ steps.gate.outputs.develop_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/develop:refs/remotes/origin/develop
          GATE_BASE="${RUNNER_TEMP}/gate-base"
          cd "$GATE_BASE"
          PYTHONPATH="$GATE_BASE" python -P -m tools.chiefs_narrative.review_gate --automerge \
            --base "origin/${BASE_REF}" \
            --head "$HEAD_SHA" \
            --head-ref "$HEAD_REF" \
            --develop-ref origin/develop \
            --fetch-develop \
            --pinned-develop-sha "$PINNED_DEVELOP_SHA" \
            --github-output "$GITHUB_OUTPUT" \
            --root "${GITHUB_WORKSPACE}"

      - name: Refuse holdAutomerge without a human develop merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          GATE_BASE="${RUNNER_TEMP}/gate-base"
          cd "$GATE_BASE"
          PYTHONPATH="$GATE_BASE" python -P -m tools.chiefs_narrative.review_gate --hold-override \
            --head "$HEAD_SHA" \
            --head-ref "$HEAD_REF" \
            --base "$BASE_SHA" \
            --develop-ref origin/develop \
            --pr-number "$PR_NUMBER" \
            --repository "$GITHUB_REPOSITORY" \
            --root "${GITHUB_WORKSPACE}"

      - name: Re-read labels and draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          payload="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          test -n "$payload"
          NEUTRAL="${RUNNER_TEMP}/label-parse"
          mkdir -p "$NEUTRAL"
          cd "$NEUTRAL"
          draft="$(printf '%s' "$payload" | python3 -P -c 'import json,sys; print(json.load(sys.stdin).get("draft"))')"
          labels="$(printf '%s' "$payload" | python3 -P -c 'import json,sys; print("\n".join(x.get("name","") for x in json.load(sys.stdin).get("labels") or []))')"
          if [ "$draft" != "False" ] && [ "$draft" != "false" ]; then
            echo "refuse: PR is draft"
            exit 1
          fi
          if printf '%s\n' "$labels" | grep -Fxq hold; then
            echo "refuse: hold label"
            exit 1
          fi

      - name: Squash-merge the pull request
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          set +e
          out="$(gh pr merge "$PR_URL" --squash --match-head-commit "$HEAD_SHA" 2>&1)"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "skip_pages=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s\n' "$out" | grep -qi 'already merged'; then
            echo "already merged; treating as success"
            echo "skip_pages=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$out" >&2
          exit "$rc"

      - name: Trigger Pages deploy
        if: ${{ steps.merge.outputs.skip_pages != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # GITHUB_TOKEN merges do not fire pages.yml's push trigger.
          # This job has no checkout; gh needs an explicit repo.
          gh workflow run "Deploy Hugo site to GitHub Pages" \
            --repo "${GITHUB_REPOSITORY}" --ref main
