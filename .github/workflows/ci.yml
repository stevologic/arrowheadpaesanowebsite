name: CI gates

# Every pull request against main runs the merge gates:
#   1. Python unit tests for the Chiefs Narrative engine (offline, no keys).
#   2. A full Hugo build with the exact production version.
# If both gates pass and the PR is not a draft (and not labeled "hold"),
# the PR is squash-merged into main automatically. A GITHUB_TOKEN merge
# does not fire pages.yml's push trigger, so automerge then dispatches
# "Deploy Hugo site to GitHub Pages" on main.
#
# Edition PRs opened with GITHUB_TOKEN still emit a pull_request event,
# but they must not queue this workflow. Runs #106, #110, #114, #118
# (36446331690) sat on "This workflow run required approval but was not
# approved before it expired" with 0 jobs — that is a first-time /
# bot-approval gate, not a concurrency/workflow_call bug. Ignore
# edition-only paths here; narrative.yml already workflow_dispatches
# these gates against the edition branch and merges.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "data/narrative.json"
      - "data/narrative_archive.json"
      - "data/narrative_repair.json"
      - "data/narrative_editions/**"
      - "data/wire.json"
      - "data/schedule_2026.json"
      - "public/images/narrative/**"
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout_ref:
        description: "Branch or SHA to gate (edition branch)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HUGO_VERSION: 0.152.2

jobs:
  gates:
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'narrative/update-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r tools/requirements.txt

      - name: Gate 0 — workflow YAML parses
        run: python -m tools.chiefs_narrative.check_workflows

      - name: Install Hugo
        run: |
          curl -fsSL --output "${{ runner.temp }}/hugo.tar.gz" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xf "${{ runner.temp }}/hugo.tar.gz"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

      - name: Gate 1 — narrative engine tests
        run: python -m unittest discover -s tools/tests -v

      - name: Pages and narrative deploy gates on the real tree
        run: |
          set -euo pipefail
          # Same command as pages.yml / narrative.yml against this checkout.
          run_gate() {
            local out="$1"
            if python -m tools.chiefs_narrative.review_gate --pages; then
              echo "skip=false" >> "$out"
            else
              rc=$?
              if [ "$rc" -eq 2 ]; then
                echo "skip=true" >> "$out"
                echo "Unsigned Review edition; skipping gh-pages deploy"
              else
                exit "$rc"
              fi
            fi
          }
          pages_out="${RUNNER_TEMP:-/tmp}/pages.skip"
          narr_out="${RUNNER_TEMP:-/tmp}/narr.skip"
          : > "$pages_out"
          : > "$narr_out"
          run_gate "$pages_out"
          run_gate "$narr_out"
          echo "pages.yml: $(cat "$pages_out")"
          echo "narrative.yml: $(cat "$narr_out")"
          grep -qx "skip=false" "$pages_out"
          grep -qx "skip=false" "$narr_out"

      - name: Fact-check the published edition
        run: python -m tools.chiefs_narrative.generate --check-edition

      - name: Render XO diagrams from narrative.json
        run: python -m tools.chiefs_narrative.generate --diagrams-only

      - name: Fail if the render rewrote committed SVGs
        run: git diff --exit-code -- public/images/narrative

      - name: Gate 2 — Hugo build
        run: hugo --gc --minify

  automerge:
    needs: gates
    # Write token is only on this job. The gates job inherits contents:read
    # and checks out with persist-credentials: false so PR tests cannot push.
    permissions:
      contents: write
      pull-requests: write
      actions: write
    # Only human/PAT pull_request events. workflow_dispatch / workflow_call
    # have no pull_request payload — do not invent a merge.
    # Edition PRs are merged by narrative.yml after this gates job succeeds.
    if: >-
      ${{ github.event_name == 'pull_request' &&
          !startsWith(github.head_ref, 'narrative/update-') &&
          github.event.pull_request.draft == false &&
          !contains(github.event.pull_request.labels.*.name, 'hold') &&
          github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Refuse unsigned Review editions
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          GATE_BASE="${RUNNER_TEMP}/gate-base"
          git worktree add --detach "$GATE_BASE" "origin/${{ github.base_ref }}"
          # cwd + python -m would import PR-head tools/ (sys.path[0]).
          # -P keeps cwd off sys.path; the module comes from GATE_BASE only.
          # --root is the PR tree, read as data, never imported.
          cd "$GATE_BASE"
          PYTHONPATH="$GATE_BASE" python -P -m tools.chiefs_narrative.review_gate --automerge \
            --base "origin/${{ github.base_ref }}" \
            --root "${GITHUB_WORKSPACE}"

      - name: Squash-merge the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Prefer GitHub auto-merge; fall back to an immediate squash merge.
          gh pr merge "${{ github.event.pull_request.html_url }}" \
            --squash --auto --delete-branch \
            --match-head-commit ${{ github.event.pull_request.head.sha }} \
            || gh pr merge "${{ github.event.pull_request.html_url }}" \
              --squash --delete-branch \
              --match-head-commit ${{ github.event.pull_request.head.sha }}

      - name: Trigger Pages deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # GITHUB_TOKEN merges do not fire pages.yml's push trigger.
          # This job has no checkout; gh needs an explicit repo.
          gh workflow run "Deploy Hugo site to GitHub Pages" \
            --repo "${GITHUB_REPOSITORY}" --ref main
