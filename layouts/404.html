<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Redirecting to The Chiefs Narrative</title>
  <link rel="canonical" href="{{ "" | absURL }}" />
  <meta name="robots" content="noindex, follow" />
  <meta http-equiv="refresh" content="0; url={{ "" | relURL }}" />
</head>
<body data-redirect="{{ "" | relURL }}">
  <p>That page is gone. Continue to <a href="{{ "" | relURL }}">The Chiefs Narrative</a>.</p>
  <script>
    (function () {
      var dest = document.body.getAttribute("data-redirect") || "/";
      location.replace(dest);
    })();
  </script>
</body>
</html>
