<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Redirecting to The Chiefs Narrative</title>
  <link rel="canonical" href="{{ .Permalink }}" />
  <meta name="robots" content="noindex, follow" />
  <meta http-equiv="refresh" content="0; url={{ .Permalink }}" />
  <script>
    (function () {
      var node = document.querySelector('link[rel="canonical"]');
      if (node && node.href) location.replace(node.href);
    })();
  </script>
</head>
<body>
  <p>This page has moved to <a href="{{ .Permalink }}">The Chiefs Narrative</a>.</p>
</body>
</html>
