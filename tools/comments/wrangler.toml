name = "arrowhead-paesano-comments"
main = "worker.js"
compatibility_date = "2026-09-01"

[vars]
COMMENTS_CORS_ORIGINS = "https://arrowheadpaesano.com,https://www.arrowheadpaesano.com"
COMMENTS_DEV = ""

[[durable_objects.bindings]]
name = "THREADS"
class_name = "CommentThread"

[[durable_objects.bindings]]
name = "RATES"
class_name = "RateBucket"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CommentThread", "RateBucket"]

# Secrets (never commit):
#   wrangler secret put COMMENTS_ADMIN_TOKEN
#   wrangler secret put TURNSTILE_SECRET
